<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeScript Café — Contact Us</title>
    <meta name="description"
        content="Get in touch with CoffeeScript Café. Visit us in Bonifacio Global City, Taguig or reach out by phone or email. Share your feedback, suggestions, or questions — we're here to connect and serve you with clarity and care.">
    <meta name="author" content="JJ Ginon">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="img/favicon/favicon-48x48.png" sizes="48x48" type="image/png">
    <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/styles.css">

    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500&family=Raleway:wght@300;600&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500&family=Raleway:wght@300;600&display=swap">
    </noscript>

    <script src="js/script.js" defer></script>
</head>

<body>
    <header class="header">
        <nav class="header__nav">
            <div class="header__div logo-container">
                <img class="header__img" src="img/logo/coffeescript-cafe-logo-transparent-300x249.webp"
                    alt="CoffeeScript Café logo" width="300" height="249" fetchpriority="high">
                <h1 class="header__h1">CoffeeScript Café</h1>
            </div>
            <div class="header__div nav-container">
                <button id="close-menu-btn" aria-label="Close menu" aria-controls="primary-nav" aria-expanded="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
                <ul id="primary-nav" class="header__ul">
                    <li><a class="header__a" href="/">Home</a></li>
                    <li><a class="header__a" href="menu.html">Menu</a></li>
                    <li><a class="header__a" href="about.html">About</a></li>
                    <li><a class="header__a" href="contact.html">Contact</a></li>
                </ul>
            </div>
            <button id="menu-btn" aria-label="Open menu" aria-controls="primary-nav" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
                </svg>
            </button>
        </nav>
    </header>

    <main class="main contact-info">
        <article class="main__article location">
            <figure class="article__figure">
                <img class="article__img" src="img/contact/coffee-up-close-1000x649.webp"
                    srcset="img/contact/coffee-up-close-300x195.webp 300w, img/contact/coffee-up-close-1000x649.webp 1000w"
                    sizes="(max-width: 600px) 300px, 1000px" alt="Close-up view of freshly brewed coffee"
                    title="Freshly brewed coffee captured in detail" width="1000" height="649" fetchpriority="high">
                <figcaption class="sr-only">
                    Fresh coffee, up close&mdash;rich texture and warm tones
                </figcaption>
            </figure>
            <h2 class="location__h2">Visit CoffeeScript Café</h2>
            <address>
                CoffeeScript Café<br>
                123 DevBrew St.<br>
                Bonifacio Global City, Taguig<br>
                Metro Manila 1634<br>
                <br>
                Phone: <a href="tel:+639171234567">+63 917 123 4567</a>
            </address>
        </article>
        <article class="main__article contact">
            <h2 class="contact__h2">Submit Feedback</h2>

            <form class="contact__form" action="https://httpbin.org/get" method="get">
                <fieldset class="contact__fieldset">
                    <legend class="offscreen">Provide your thoughts, suggestions, or questions</legend>
                    <p class="contact__p">
                        <label class="contact__label" for="name">Name:</label>
                        <input class="contact__input" type="text" name="name" id="name" placeholder="Your name"
                            required="" autocomplete="name">
                    </p>
                    <p class="contact__p">
                        <label class="contact__label" for="email">Email:</label>
                        <input class="contact__input" type="email" name="email" id="email" placeholder="Your email"
                            required="" autocomplete="email">
                    </p>
                    <p class="contact__p">
                        <label class="contact__label" for="message">Your Message:</label>
                        <textarea class="contact__textarea" name="message" id="message" cols="30" rows="10"
                            placeholder="Type your message here..."></textarea>
                    </p>
                </fieldset>
                <fieldset class="contact__fieldset button-container">
                    <button class="contact__button" type="submit">Send</button>
                    <button class="contact__button" type="reset">Reset</button>
                </fieldset>
            </form>
        </article>
        <button id="backToTop" aria-label="Back to top">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"
                preserveAspectRatio="xMidYMid meet">
                <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.59 5.58L20 12l-8-8-8 8z" />
            </svg>
        </button>
    </main>
</body>

</html>
